<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview History — InterviAI</title>
  <meta name="description" content="View your complete InterviAI interview history with scores, dates, and performance trends.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <div id="topbar-placeholder"></div>

      <main class="page-content">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px">
          <div class="page-header" style="margin:0">
            <h1>Interview History</h1>
            <p>All your past interview sessions and performance records</p>
          </div>
          <a href="configure.html" class="btn-hm btn-primary">
            <i class="bi bi-plus-lg"></i> New Interview
          </a>
        </div>

        <!-- Summary Stats -->
        <div class="stats-grid" style="margin-bottom:24px" id="history-stats">
          <!-- Populated by JS -->
        </div>

        <!-- Filters -->
        <div class="card-hm" style="margin-bottom:16px;padding:14px 16px">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <div class="input-group-hm" style="width:auto;flex:1;min-width:180px">
              <i class="bi bi-search input-icon"></i>
              <input type="text" id="history-search" class="form-control-hm" placeholder="Search by role or type..." aria-label="Search history">
            </div>
            <select class="form-control-hm" id="filter-type" style="width:160px" aria-label="Filter by interview type">
              <option value="">All Types</option>
              <option value="Technical">Technical</option>
              <option value="HR">HR</option>
              <option value="Project Based">Project Based</option>
            </select>
            <select class="form-control-hm" id="filter-status" style="width:150px" aria-label="Filter by status">
              <option value="">All Status</option>
              <option value="Completed">Completed</option>
              <option value="Incomplete">Incomplete</option>
            </select>
            <button class="btn-hm btn-ghost btn-sm" onclick="clearFilters()" aria-label="Clear filters">
              <i class="bi bi-x-circle"></i> Clear
            </button>
          </div>
        </div>

        <!-- Desktop Table -->
        <div class="card-hm history-table-wrap" style="padding:0;overflow:hidden">
          <table class="history-table" id="history-table" aria-label="Interview history table">
            <thead>
              <tr>
                <th>#</th>
                <th>Date</th>
                <th>Role</th>
                <th>Type</th>
                <th>Score</th>
                <th>Duration</th>
                <th>Questions</th>
                <th>Status</th>
                <th style="text-align:right">Action</th>
              </tr>
            </thead>
            <tbody id="history-tbody">
              <!-- Populated by JS -->
            </tbody>
          </table>

          <div id="history-empty" style="display:none;text-align:center;padding:48px;color:var(--text-muted)">
            <i class="bi bi-camera-video" style="font-size:2.5rem;display:block;margin-bottom:12px"></i>
            <div style="font-size:0.9rem;font-weight:600;margin-bottom:8px">No interviews found</div>
            <a href="configure.html" class="btn-hm btn-primary btn-sm">Start Your First Interview</a>
          </div>
        </div>

        <!-- Mobile Cards -->
        <div id="history-mobile-cards" style="display:none;flex-direction:column;gap:12px">
          <!-- Populated by JS -->
        </div>

      </main>
    </div>
  </div>

  <div id="mobile-nav-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let allHistory = [];

    function renderStats(history) {
      const el = document.getElementById('history-stats');
      if (!el) return;
      const total = history.length;
      const completed = history.filter(h => h.status === 'Completed').length;
      const avgScore = total > 0 ? Math.round(history.reduce((s, h) => s + h.score, 0) / total) : 0;
      const bestScore = total > 0 ? Math.max(...history.map(h => h.score)) : 0;

      el.innerHTML = `
        <div class="card-hm card-hover">
          <div class="flex-between">
            <div><div class="card-title">Total Sessions</div><div class="stat-value">${total}</div></div>
            <div class="card-icon accent"><i class="bi bi-camera-video-fill"></i></div>
          </div>
        </div>
        <div class="card-hm card-hover">
          <div class="flex-between">
            <div><div class="card-title">Completed</div><div class="stat-value">${completed}</div></div>
            <div class="card-icon success"><i class="bi bi-check-circle-fill"></i></div>
          </div>
        </div>
        <div class="card-hm card-hover">
          <div class="flex-between">
            <div><div class="card-title">Average Score</div><div class="stat-value">${avgScore}</div></div>
            <div class="card-icon purple"><i class="bi bi-graph-up-arrow"></i></div>
          </div>
        </div>
        <div class="card-hm card-hover">
          <div class="flex-between">
            <div><div class="card-title">Best Score</div><div class="stat-value">${bestScore}</div></div>
            <div class="card-icon warning"><i class="bi bi-trophy-fill"></i></div>
          </div>
        </div>
      `;
    }

    function renderTable(history) {
      const tbody = document.getElementById('history-tbody');
      const emptyEl = document.getElementById('history-empty');
      const mobileCards = document.getElementById('history-mobile-cards');

      if (history.length === 0) {
        if (tbody) tbody.innerHTML = '';
        if (emptyEl) emptyEl.style.display = 'block';
        if (mobileCards) mobileCards.innerHTML = '';
        return;
      }

      if (emptyEl) emptyEl.style.display = 'none';

      if (tbody) {
        tbody.innerHTML = history.map((item, i) => `
          <tr>
            <td style="color:var(--text-muted)">${i + 1}</td>
            <td style="white-space:nowrap">${Utils.formatDate(item.date)}</td>
            <td style="font-weight:600;color:var(--text-primary)">${item.role}</td>
            <td><span class="badge-hm badge-navy">${item.type}</span></td>
            <td><span class="score-chip ${Utils.getScoreClass(item.score)}">${item.score}/100</span></td>
            <td>${item.duration}</td>
            <td>${item.questions || 10}</td>
            <td>
              <span class="badge-hm ${item.status === 'Completed' ? 'badge-success' : 'badge-warning'}">
                <i class="bi ${item.status === 'Completed' ? 'bi-check-circle-fill' : 'bi-clock'}"></i>
                ${item.status}
              </span>
            </td>
            <td style="text-align:right">
              <div style="display:flex;gap:6px;justify-content:flex-end">
                <a href="report.html" class="btn-hm btn-outline btn-sm" aria-label="View report for ${item.role}">
                  <i class="bi bi-bar-chart-fill"></i> Report
                </a>
                <button class="btn-hm btn-ghost btn-sm" onclick="deleteEntry('${item.id}')" aria-label="Delete interview session">
                  <i class="bi bi-trash3"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      // Mobile cards
      if (mobileCards) {
        mobileCards.innerHTML = history.map(item => `
          <div class="history-mobile-card card-hm">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div>
                <div style="font-size:0.9rem;font-weight:700;color:var(--text-primary)">${item.role}</div>
                <div style="font-size:0.78rem;color:var(--text-muted)">${Utils.formatDate(item.date)} • ${item.duration}</div>
              </div>
              <span class="score-chip ${Utils.getScoreClass(item.score)}" style="font-size:0.85rem">${item.score}/100</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
              <span class="badge-hm badge-navy">${item.type}</span>
              <span class="badge-hm ${item.status === 'Completed' ? 'badge-success' : 'badge-warning'}">
                ${item.status}
              </span>
            </div>
            <a href="report.html" class="btn-hm btn-outline btn-sm" style="width:100%;justify-content:center">
              <i class="bi bi-bar-chart-fill"></i> View Report
            </a>
          </div>
        `).join('');
      }
    }

    function filterHistory() {
      const search = document.getElementById('history-search')?.value.toLowerCase() || '';
      const type = document.getElementById('filter-type')?.value || '';
      const status = document.getElementById('filter-status')?.value || '';

      const filtered = allHistory.filter(h => {
        const matchSearch = !search || h.role.toLowerCase().includes(search) || h.type.toLowerCase().includes(search);
        const matchType = !type || h.type === type;
        const matchStatus = !status || h.status === status;
        return matchSearch && matchType && matchStatus;
      });

      renderTable(filtered);
    }

    function clearFilters() {
      document.getElementById('history-search').value = '';
      document.getElementById('filter-type').value = '';
      document.getElementById('filter-status').value = '';
      renderTable(allHistory);
    }

    function deleteEntry(id) {
      Utils.confirm('Delete Entry', 'Remove this interview session from history?', () => {
        const h = Storage.getHistory().filter(e => e.id !== id);
        Storage.set('history', h);
        allHistory = h;
        renderStats(h);
        renderTable(h);
        Utils.showSuccess('Deleted', 'Interview session removed.');
      }, 'Delete', 'btn-danger');
    }

    document.addEventListener('DOMContentLoaded', () => {
      App.init({ topbarTitle: 'History', activePage: 'history' });

      allHistory = Storage.getHistory();
      renderStats(allHistory);
      renderTable(allHistory);

      // Responsive: show mobile cards on small screens
      if (window.innerWidth < 768) {
        const tableWrap = document.querySelector('.history-table-wrap');
        const mobileCards = document.getElementById('history-mobile-cards');
        if (tableWrap) tableWrap.style.display = 'none';
        if (mobileCards) mobileCards.style.display = 'flex';
      }

      document.getElementById('history-search')?.addEventListener('input', filterHistory);
      document.getElementById('filter-type')?.addEventListener('change', filterHistory);
      document.getElementById('filter-status')?.addEventListener('change', filterHistory);
    });
  </script>
</body>
</html>

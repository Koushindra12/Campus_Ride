<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Campus Rides</title>
  <meta name="description" content="Create your free Campus Rides account and start sharing rides today."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:1rem;}
    .card{width:100%;max-width:480px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:1.5rem;padding:2.5rem 2rem;box-shadow:0 25px 60px rgba(0,0,0,0.4);}
    .logo{text-align:center;margin-bottom:1.75rem;}
    .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:1rem;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem;box-shadow:0 10px 30px rgba(124,58,237,0.4);}
    .logo-icon i{font-size:1.8rem;color:#fff;}
    .logo h1{font-size:1.5rem;font-weight:900;color:#fff;margin-top:0.4rem;}
    .logo p{color:rgba(255,255,255,0.45);font-size:0.82rem;margin-top:0.2rem;}
    .alert{padding:0.7rem 1rem;border-radius:0.75rem;font-size:0.83rem;font-weight:500;margin-bottom:1rem;}
    .alert-error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
    .alert-success{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#86efac;}
    label{display:block;font-size:0.78rem;font-weight:600;color:rgba(255,255,255,0.6);margin-bottom:0.35rem;}
    .form-group{margin-bottom:1rem;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.85rem;}
    @media(max-width:480px){.grid2{grid-template-columns:1fr;}}
    input,select{width:100%;padding:0.75rem 1rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:0.75rem;color:#fff;font-size:0.9rem;font-family:'Inter',sans-serif;outline:none;transition:all 0.2s;-webkit-appearance:none;}
    input:focus,select:focus{border-color:#7c3aed;background:rgba(124,58,237,0.1);box-shadow:0 0 0 3px rgba(124,58,237,0.2);}
    input::placeholder{color:rgba(255,255,255,0.3);}
    select option{background:#1e1b4b;color:#fff;}
    .email-type-toggle{display:flex;gap:0.5rem;margin-bottom:1rem;}
    .type-btn{flex:1;padding:0.6rem;border-radius:0.6rem;border:1.5px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;}
    .type-btn.active{background:rgba(124,58,237,0.3);border-color:#7c3aed;color:#c4b5fd;}
    .btn{width:100%;padding:0.9rem;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:0.75rem;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s;font-family:'Inter',sans-serif;margin-top:0.5rem;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(124,58,237,0.5);}
    .footer-links{text-align:center;font-size:0.82rem;color:rgba(255,255,255,0.45);margin-top:1.25rem;}
    .link{color:#a78bfa;text-decoration:none;font-weight:600;}
    .link:hover{color:#c4b5fd;}
    .input-icon-wrap{position:relative;}
    .input-icon-wrap input{padding-left:2.75rem;}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:0.9rem;color:rgba(255,255,255,0.4);pointer-events:none;}
    .show-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:0.9rem;}
    .hint{font-size:0.73rem;color:rgba(255,255,255,0.35);margin-top:0.3rem;}
    .pw-strength{height:3px;border-radius:2px;margin-top:0.4rem;transition:all 0.3s;background:rgba(255,255,255,0.1);}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-motorcycle"></i></div>
      <h1>Create Account</h1>
      <p>Join Campus Rides — free &amp; instant</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/register" autocomplete="on">
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" name="name" id="name" placeholder="e.g. Ravi Kumar" required autocomplete="name"/>
        </div>
      </div>

      <div class="form-group">
        <label>Email Type</label>
        <div class="email-type-toggle">
          <button type="button" class="type-btn active" id="personal-btn" onclick="setType('personal')">
            <i class="fa-solid fa-envelope"></i> Personal
          </button>
          <button type="button" class="type-btn" id="uni-btn" onclick="setType('university')">
            <i class="fa-solid fa-graduation-cap"></i> University
          </button>
        </div>
        <input type="hidden" name="email_type" id="email_type" value="personal"/>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-at input-icon"></i>
          <input type="email" name="email" id="email" placeholder="you@gmail.com" required autocomplete="email"/>
        </div>
        <p class="hint" id="email-hint">Gmail, Yahoo, Outlook, Hotmail accepted</p>
      </div>

      <div class="grid2">
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" name="password" id="password" placeholder="Min 6 chars" required autocomplete="new-password" oninput="checkPw()"/>
            <button type="button" class="show-pw" onclick="togglePw('password','pw-eye')">
              <i class="fa-solid fa-eye" id="pw-eye"></i>
            </button>
          </div>
          <div class="pw-strength" id="pw-strength"></div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Repeat password" required autocomplete="new-password"/>
            <button type="button" class="show-pw" onclick="togglePw('confirm_password','cpw-eye')">
              <i class="fa-solid fa-eye" id="cpw-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="footer-links">
      Already have an account? <a href="/login" class="link">Sign in <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </div>

  <script>
    function setType(t){
      document.getElementById('email_type').value=t;
      const persBtn=document.getElementById('personal-btn');
      const uniBtn=document.getElementById('uni-btn');
      const hint=document.getElementById('email-hint');
      const emailInput=document.getElementById('email');
      if(t==='personal'){
        persBtn.classList.add('active'); uniBtn.classList.remove('active');
        emailInput.placeholder='you@gmail.com';
        hint.textContent='Gmail, Yahoo, Outlook, Hotmail accepted';
      } else {
        uniBtn.classList.add('active'); persBtn.classList.remove('active');
        emailInput.placeholder='you@university.ac.in';
        hint.textContent='.ac.in / .edu / .edu.in domain accepted';
      }
    }
    function togglePw(id, iconId){
      const inp=document.getElementById(id);
      const icon=document.getElementById(iconId);
      if(inp.type==='password'){
        inp.type='text';
        icon.className='fa-solid fa-eye-slash';
      } else {
        inp.type='password';
        icon.className='fa-solid fa-eye';
      }
    }
    function checkPw(){
      const pw=document.getElementById('password').value;
      const bar=document.getElementById('pw-strength');
      if(pw.length===0){bar.style.width='0';bar.style.background='rgba(255,255,255,0.1)';}
      else if(pw.length<6){bar.style.width='30%';bar.style.background='#ef4444';}
      else if(pw.length<10){bar.style.width='65%';bar.style.background='#f59e0b';}
      else{bar.style.width='100%';bar.style.background='#22c55e';}
    }
  </script>
</body>
</html>

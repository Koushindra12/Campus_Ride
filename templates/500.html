<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — Internal Server Error</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#4c0519);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:2rem;}
    .icon{font-size:4rem;color:#f87171;margin-bottom:1rem;animation:shake 2s ease-in-out infinite;}
    @keyframes shake{0%,100%{transform:rotate(0deg);}20%{transform:rotate(-10deg);}40%{transform:rotate(10deg);}60%{transform:rotate(-5deg);}80%{transform:rotate(5deg);}}
    h1{font-size:6rem;font-weight:900;background:linear-gradient(90deg,#f87171,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    h2{font-size:1.5rem;font-weight:700;margin:1rem 0 0.5rem;}
    p{color:rgba(255,255,255,0.5);margin-bottom:2rem;}
    a{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 2rem;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border-radius:0.75rem;text-decoration:none;font-weight:700;transition:all 0.3s;}
    a:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(220,38,38,0.5);}
  </style>
</head>
<body>
  <div>
    <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1>500</h1>
    <h2>Server Error</h2>
    <p>Something went wrong on our end. Please try again in a moment.</p>
    <a href="/dashboard"><i class="fa-solid fa-arrow-left"></i> Go to Dashboard</a>
  </div>
</body>
</html>

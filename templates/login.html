<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Campus Rides</title>
  <meta name="description" content="Login to Campus Rides — your campus ride sharing platform."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:1rem;}
    .card{width:100%;max-width:420px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:1.5rem;padding:2.5rem 2rem;box-shadow:0 25px 60px rgba(0,0,0,0.4);}
    .logo{text-align:center;margin-bottom:2rem;}
    .logo-icon{width:72px;height:72px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:1.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 0.9rem;box-shadow:0 10px 35px rgba(124,58,237,0.45);}
    .logo-icon i{font-size:2rem;color:#fff;}
    .logo h1{font-size:1.6rem;font-weight:900;color:#fff;margin-top:0.5rem;}
    .logo p{color:rgba(255,255,255,0.5);font-size:0.85rem;margin-top:0.25rem;}
    .alert{padding:0.75rem 1rem;border-radius:0.75rem;font-size:0.85rem;font-weight:500;margin-bottom:1.25rem;}
    .alert-error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
    .alert-success{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#86efac;}
    .alert-warning{background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);color:#fde68a;}
    .alert-info{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#c7d2fe;}
    label{display:block;font-size:0.8rem;font-weight:600;color:rgba(255,255,255,0.65);margin-bottom:0.4rem;}
    .form-group{margin-bottom:1.25rem;}
    input{width:100%;padding:0.8rem 1rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:0.75rem;color:#fff;font-size:0.95rem;font-family:'Inter',sans-serif;outline:none;transition:all 0.2s;}
    input:focus{border-color:#7c3aed;background:rgba(124,58,237,0.1);box-shadow:0 0 0 3px rgba(124,58,237,0.2);}
    input::placeholder{color:rgba(255,255,255,0.3);}
    .btn{width:100%;padding:0.9rem;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:0.75rem;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(124,58,237,0.5);}
    .divider{text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;margin:1.25rem 0;position:relative;}
    .divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:rgba(255,255,255,0.1);}
    .divider::before{left:0;} .divider::after{right:0;}
    .link{color:#a78bfa;text-decoration:none;font-weight:600;}
    .link:hover{color:#c4b5fd;}
    .footer-links{text-align:center;font-size:0.82rem;color:rgba(255,255,255,0.45);margin-top:1.25rem;}
    .forgot{display:block;text-align:right;font-size:0.78rem;color:#a78bfa;text-decoration:none;margin-top:-0.75rem;margin-bottom:1.25rem;}
    .forgot:hover{color:#c4b5fd;}
    .input-icon-wrap{position:relative;}
    .input-icon-wrap input{padding-left:2.75rem;}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:0.95rem;color:rgba(255,255,255,0.4);pointer-events:none;}
    .show-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:0.95rem;}
    .show-pw:hover{color:rgba(255,255,255,0.7);}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-motorcycle"></i></div>
      <h1>Campus Rides</h1>
      <p>Welcome back! Sign in to continue.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login" autocomplete="on">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" name="email" id="email" placeholder="you@university.ac.in" required autocomplete="email"/>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
          <button type="button" class="show-pw" onclick="togglePw()" id="toggle-pw-btn">
            <i class="fa-solid fa-eye" id="pw-icon"></i>
          </button>
        </div>
      </div>
      <a href="/forgot-password" class="forgot">Forgot password?</a>
      <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
    </form>

    <div class="divider">or</div>
    <div class="footer-links">
      Don't have an account? <a href="/register" class="link">Create one <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </div>

  <script>
    function togglePw(){
      const pw=document.getElementById('password');
      const icon=document.getElementById('pw-icon');
      if(pw.type==='password'){
        pw.type='text';
        icon.className='fa-solid fa-eye-slash';
      } else {
        pw.type='password';
        icon.className='fa-solid fa-eye';
      }
    }
  </script>
</body>
</html>
